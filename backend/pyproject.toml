[project]
name = "chinese-translator-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hditx", email = "pablogabrieloporto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "pypinyin>=0.55.0",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

